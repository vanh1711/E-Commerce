<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Brand Gradient -->
    <linearGradient id="psGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Metallic Gold/Cyan Accent -->
    <linearGradient id="psAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="psBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="32" ry="32" fill="url(#psBg)" stroke="url(#psBorder)" stroke-width="3" />

  <!-- Inner Subtle Grid/Tech Accent -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Modern Flagship Smartphone Shape -->
  <rect x="36" y="20" width="56" height="88" rx="14" ry="14" fill="none" stroke="url(#psGlow)" stroke-width="4.5" filter="url(#glow)" />
  
  <!-- Stylized Monogram "P" Screen Graphic inside phone -->
  <path d="M 52 38 L 70 38 C 77 38 81 42 81 48 C 81 54 77 58 70 58 L 60 58 L 60 76 L 52 76 Z M 60 45 L 60 51 L 69 51 C 72 51 74 49 74 48 C 74 46 72 45 69 45 Z" fill="url(#psAccent)" filter="url(#glow)" />

  <!-- Dynamic Island -->
  <rect x="56" y="24" width="16" height="4" rx="2" ry="2" fill="#38BDF8" />

  <!-- Bottom Home Indicator Bar -->
  <rect x="52" y="99" width="24" height="2.5" rx="1.2" fill="#60A5FA" opacity="0.8" />
  
  <!-- Sparkle Diamond -->
  <polygon points="98,22 102,28 98,34 94,28" fill="#38BDF8" filter="url(#glow)" />
</svg>
