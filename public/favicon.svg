<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Brand Gradient -->
    <linearGradient id="vpGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Metallic Gold/Cyan Accent -->
    <linearGradient id="vpAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="vpBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="32" ry="32" fill="url(#vpBg)" stroke="url(#vpBorder)" stroke-width="3" />

  <!-- Inner Subtle Grid/Tech Accent -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Stylized Monogram "V" / Phone Notch & Wings -->
  <!-- Left Wing of V -->
  <path d="M 28 34 L 46 34 L 64 88 L 52 88 Z" fill="url(#vpGlow)" filter="url(#glow)" />
  
  <!-- Right Wing of V (Overlapping with Phone Screen Contour) -->
  <path d="M 100 34 L 82 34 L 64 88 L 76 88 Z" fill="url(#vpAccent)" filter="url(#glow)" />

  <!-- Central Dynamic Phone Notch / Diamond Sparkle -->
  <polygon points="64,22 69,32 64,42 59,32" fill="#38BDF8" filter="url(#glow)" />

  <!-- Bottom Apex Jewel -->
  <circle cx="64" cy="98" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  
  <!-- Mini Corner Micro-dot for Camera/Antenna -->
  <circle cx="94" cy="24" r="2.5" fill="#60A5FA" opacity="0.8" />
</svg>
